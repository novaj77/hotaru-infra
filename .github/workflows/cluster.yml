name: cluster

on:
  workflow_dispatch:
    inputs:
      action:
        description: Start or stop the hotaru cluster
        required: true
        type: choice
        options:
          - up
          - down

permissions:
  contents: read
  id-token: write

concurrency:
  group: cluster-hotaru
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  TF_IN_AUTOMATION: "true"
  CLUSTER_NAME: hotaru
  ZONE_NAME: hotaru-novaj.click
  API_HOST: api.hotaru-novaj.click

jobs:
  up:
    if: inputs.action == 'up'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Record the start time
        run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-terraform

      - name: Assume role with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: hotaru-cluster-ci-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan the cluster
        working-directory: terraform/cluster
        run: |
          terraform init -input=false
          terraform plan -input=false -out=cluster.tfplan

      - name: Apply the saved plan
        working-directory: terraform/cluster
        run: terraform apply -input=false cluster.tfplan

      - name: Create a token for hotaru-deploy
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPLOY_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_READER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: hotaru-deploy
          permission-contents: read

      - name: Check out hotaru-deploy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/hotaru-deploy
          token: ${{ steps.app-token.outputs.token }}
          path: hotaru-deploy
          persist-credentials: false

      - name: Set up Helm, helmfile and helm-diff
        uses: ./hotaru-deploy/.github/actions/setup-helmfile
        with:
          helm-diff: true

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --alias hotaru

      - name: Install everything with helmfile
        working-directory: hotaru-deploy
        run: helmfile apply

      - name: Wait for the DNS record
        run: |
          zone_id=$(aws route53 list-hosted-zones-by-name --dns-name "$ZONE_NAME" --query "HostedZones[?Name=='${ZONE_NAME}.'].Id | [0]" --output text)
          for _ in $(seq 1 60); do
            count=$(aws route53 list-resource-record-sets --hosted-zone-id "$zone_id" --query "length(ResourceRecordSets[?Name=='${API_HOST}.' && Type=='A'])" --output text)
            if [ "$count" != 0 ]; then
              echo "Found the A record for $API_HOST"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The A record for $API_HOST did not appear in 10 minutes"
          exit 1

      - name: Wait for /healthz
        run: |
          for _ in $(seq 1 60); do
            if [ "$(curl -fsS --max-time 5 "https://${API_HOST}/healthz" 2>/dev/null)" = ok ]; then
              echo "https://${API_HOST}/healthz returned ok"
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://${API_HOST}/healthz did not return ok in 10 minutes"
          exit 1

      - name: Write the summary
        run: |
          minutes=$(( ($(date +%s) - STARTED_AT) / 60 ))
          {
            echo "Cluster $CLUSTER_NAME is up in about $minutes minutes: https://${API_HOST}/healthz"
            echo
            echo '```'
            helm list --kube-context hotaru --all-namespaces
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  down:
    if: inputs.action == 'down'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-terraform

      - name: Assume role with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: hotaru-cluster-ci-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
