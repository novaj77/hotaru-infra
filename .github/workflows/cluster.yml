name: cluster

on:
  workflow_dispatch:
    inputs:
      action:
        description: Start or stop the hotaru cluster
        required: true
        type: choice
        options:
          - up
          - down

permissions:
  contents: read

concurrency:
  group: cluster-hotaru
  cancel-in-progress: false

jobs:
  up:
    if: inputs.action == 'up'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-terraform

  down:
    if: inputs.action == 'down'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-terraform
