name: cluster

on:
  workflow_dispatch:
    inputs:
      action:
        description: Start or stop the hotaru cluster
        required: true
        type: choice
        options:
          - up
          - down

permissions:
  contents: read
  id-token: write

concurrency:
  group: cluster-hotaru
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  TF_IN_AUTOMATION: "true"

jobs:
  up:
    if: inputs.action == 'up'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-terraform

      - name: Assume role with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: hotaru-cluster-ci-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan the cluster
        working-directory: terraform/cluster
        run: |
          terraform init -input=false
          terraform plan -input=false -out=cluster.tfplan

      - name: Apply the saved plan
        working-directory: terraform/cluster
        run: terraform apply -input=false cluster.tfplan

  down:
    if: inputs.action == 'down'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-terraform

      - name: Assume role with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: hotaru-cluster-ci-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
