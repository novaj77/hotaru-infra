name: Set up Terraform
description: Install the pinned Terraform after verifying its SHA-256 checksum

runs:
  using: composite
  steps:
    - name: Install Terraform
      shell: bash
      env:
        TERRAFORM_VERSION: 1.16.4
        TERRAFORM_SHA256: dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df
      run: |
        curl -fsSLo "$RUNNER_TEMP/terraform.zip" "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
        echo "${TERRAFORM_SHA256}  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
        unzip -o -q "$RUNNER_TEMP/terraform.zip" terraform -d "$RUNNER_TEMP"
        sudo install -m 0755 "$RUNNER_TEMP/terraform" /usr/local/bin/terraform
        terraform version
